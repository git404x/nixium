name: Upgrade MC Version

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'New Minecraft Version (e.g., 1.21.1)'
        required: true

jobs:
  upgrade-mc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install Packwiz and jq
        run: |
          nix profile install nixpkgs#packwiz nixpkgs#jq

      - name: Upgrade Server MC Version
        run: |
          cd server
          packwiz migrate --mc-version ${{ github.event.inputs.mc_version }}
          packwiz update --all

      - name: Upgrade Client MC Version
        run: |
          cd client
          packwiz migrate --mc-version ${{ github.event.inputs.mc_version }}
          packwiz update --all

      - name: Update Hashes
        run: |
          chmod +x update.sh
          ./update.sh

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: upgrade MC to ${{ github.event.inputs.mc_version }} and update hashes"
          file_pattern: "server/* client/* versions.json"

      - name: Build and Export Modpacks
        id: build
        run: |
          MC_VER=$(grep -Po 'minecraft = "\K[^"]+' server/pack.toml)
          FABRIC_VER=$(grep -Po 'fabric = "\K[^"]+' server/pack.toml)
          TAG="v${MC_VER}"
          
          cd server
          packwiz modrinth export -o ../Nixium-Server-${MC_VER}.mrpack
          cd ../client
          packwiz modrinth export -o ../Nixium-Client-${MC_VER}.mrpack
          cd ..
          
          echo "mc_ver=$MC_VER" >> $GITHUB_OUTPUT
          echo "fabric_ver=$FABRIC_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Nixium Modpack - Minecraft ${{ steps.build.outputs.mc_ver }}
          body: |
            ### Minecraft Version Upgrade
            **Minecraft Version**: ${{ steps.build.outputs.mc_ver }}
            **Fabric Loader**: ${{ steps.build.outputs.fabric_ver }}
            
            This release contains the newly upgraded Nixium Server and Nixium Client.
          files: |
            Nixium-Server-*.mrpack
            Nixium-Client-*.mrpack
          draft: false
          prerelease: false
